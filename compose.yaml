services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: spendwise
      POSTGRES_DB: spendwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spendwise -d spendwise"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgresql://spendwise:${POSTGRES_PASSWORD}@db:5432/spendwise?schema=public
    command: ["npm", "run", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://spendwise:${POSTGRES_PASSWORD}@db:5432/spendwise?schema=public
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  cleanup:
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgresql://spendwise:${POSTGRES_PASSWORD}@db:5432/spendwise?schema=public
    command: ["sh", "-c", "while true; do npm run data:cleanup; sleep 3600; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  pgdata:
